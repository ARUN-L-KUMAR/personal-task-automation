services:
  - type: web
    name: personal-task-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # ── Add all secrets below in the Render Dashboard (do NOT commit real values) ──
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AI_MODEL_NAME
        value: deepseek/deepseek-r1
      - key: AI_TEMPERATURE
        value: "0.4"
      - key: AI_MAX_TOKENS
        value: "150"
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      # ── Set this to your Vercel frontend URL after deploy ──
      - key: ALLOWED_ORIGINS
        value: https://personal-task-automation.vercel.app
